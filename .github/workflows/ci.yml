name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a vulnerability published after the last change still turns CI red.
  schedule:
    - cron: "0 6 * * 1"

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
          POSTGRES_DB: family_finances
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_finances"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      # Lint includes Ruff's security rules (S, from Bandit).
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --format requirements-txt --no-emit-project > requirements.txt
          uvx pip-audit@2.10.1 --strict --disable-pip --require-hashes -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: a secret removed later is still in old commits
      - name: Scan the history for secrets with gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${archive}"
          echo "${SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          ./gitleaks git --redact --no-banner .
