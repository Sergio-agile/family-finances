services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: family
      POSTGRES_PASSWORD: family
      POSTGRES_DB: family_finances
    # 5434 on the host: 5432 (local Postgres) and 5433 (easy-admin) are taken on this machine.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family -d family_finances"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
