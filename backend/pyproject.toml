[project]
name = "family-finances-api"
version = "0.1.0"
description = "API for tracking family expenses"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.161.1",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy>=2.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

# This is an application, not a library: uv only manages its dependencies.
[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# FAST: FastAPI, PT: pytest, PERF: performance anti-patterns, RUF: Ruff's own rules.
select = ["E", "F", "I", "UP", "B", "SIM", "FAST", "PT", "PERF", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
